<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>饼干小铺 · 产品一览</title>

<!-- 提前设好深浅色，避免页面打开时闪一下 -->
<script>
  (function () {
    var t = localStorage.getItem('theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<style>
  /* ===== 颜色变量（想改整体色调就改这里）===== */
  :root {
    --bg: #f4ecdb;            /* 顶部/标签底色（米色） */
    --surface: #fffcf5;       /* 卡片/弹窗底色（暖白） */
    --text: #3d3427;          /* 正文颜色（暖深棕） */
    --muted: #8a7d6a;         /* 次要文字 */
    --text-soft: #5c5142;     /* 详情文字（清楚一点） */
    --border: #e7dbc4;        /* 边框（米色） */
    --accent: #c07a35;        /* 点缀色（焦糖棕） */
    --shadow: 0 1px 3px rgba(120,95,60,.08), 0 8px 24px rgba(120,95,60,.10);
    /* 动态渐变的四个颜色（米色 + 橙色，首尾同色避免断层） */
    --grad-a: #f6eee0;
    --grad-b: #f4a95e;
    --grad-c: #fbe3c1;
    --grad-d: #f6eee0;
    /* 彩色小圆点：有糖暖橙；无糖绿色 */
    --dot-sugar:     #e0a458;
    --dot-sugarfree: #6fae7c;
  }
  :root[data-theme="dark"] {
    --bg: #251b12;            /* 页面底色（深暖棕） */
    --surface: #2f2419;       /* 卡片/弹窗底色（深暖棕） */
    --text: #f2e9db;          /* 正文（暖米白） */
    --muted: #bfab93;         /* 次要文字 */
    --text-soft: #dfd2bf;     /* 详情文字 */
    --border: #4a3a28;        /* 边框（暖棕） */
    --accent: #e2a55a;        /* 点缀色（焦糖橙，呼应浅色） */
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
    /* 深色（焦糖暖棕 + 琥珀）渐变，首尾同色避免断层 */
    --grad-a: #2e2013;
    --grad-b: #1b130b;
    --grad-c: #4a2d15;
    --grad-d: #2e2013;
    --dot-sugar:     #e6ad66;
    --dot-sugarfree: #8fbf9a;
  }

  /* ===== 基础 ===== */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    background-color: var(--bg);
    background-image: linear-gradient(120deg, var(--grad-a), var(--grad-b), var(--grad-c), var(--grad-d));
    background-size: 300% 300%;
    animation: gradientShift 9s ease infinite;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  /* 米色动态渐变（流动） */
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
  }

  /* 深浅色切换的平滑过渡 */
  body, .topbar, .card, .card-name, .card-detail, .theme-btn, .back-top,
  .search-input, .modal-box, .page-btn, .page-info, .empty,
  .site-footer {
    transition: background-color .4s ease, color .4s ease, border-color .4s ease;
  }

  /* ===== 顶部 ===== */
  .topbar {
    background-color: transparent;
    border-bottom: 1px solid var(--border);
    padding: 12px 20px 14px;
  }
  .topbar-inner, .search-wrap {
    max-width: 1080px;
    margin: 0 auto;
  }
  .topbar-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;      /* 标题居中 */
    margin-bottom: 12px;
  }
  .site-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .site-title .accent { color: var(--accent); }

  .theme-btn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-btn svg { width: 22px; height: 22px; }
  /* 浅色显示太阳，深色显示月亮 */
  .theme-btn .icon-sun  { display: none; }
  .theme-btn .icon-moon { display: none; }
  :root[data-theme="light"] .theme-btn .icon-sun  { display: block; }
  :root[data-theme="dark"]  .theme-btn .icon-moon { display: block; }

  /* 搜索框 */
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--muted);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    box-shadow: var(--shadow);
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  /* ===== 卡片网格 ===== */
  .content {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 20px 32px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;                /* 手机：一行 1 个（大卡） */
    gap: 18px;
  }
  @media (min-width: 600px)  { .grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } } /* 电脑：一行 4 个 */

  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background-color .4s ease;
  }
  .card:hover  { transform: translateY(-2px); }
  .card:active { transform: scale(.98); }

  .card-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;        /* 正方形 */
    background: #efe6d4;
  }
  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;          /* 保持正方形，不变形，多出来的裁掉 */
    display: block;
  }

  /* 角落的彩色小圆点（有糖/无糖） */
  .dot {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--dot-sugar);   /* 默认：有糖 */
    box-shadow: 0 0 0 2px rgba(255,255,255,.65);
  }
  .dot[data-tag="无糖"] { background: var(--dot-sugarfree); }

  .card-name {
    margin: 0;
    padding: 13px 12px 6px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
  }

  /* 卡片上的详情：所有设备都显示两行 */
  .card-detail {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
    padding: 0 14px 8px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--muted);
    text-align: center;
  }
  /* 每张卡片下方的提示字 */
  .card-hint {
    margin: 0;
    padding: 0 12px 14px;
    font-size: 13px;
    color: var(--accent);
    text-align: center;
  }
  @media (max-width: 599px) {
    .card-name { font-size: 18px; }
  }

  /* 没搜到时的提示 */
  .empty {
    margin: 48px 0;
    text-align: center;
    font-size: 17px;
    color: var(--muted);
  }

  /* ===== 分页（只在手机上显示）===== */
  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 26px;
  }
  .page-btn {
    font-size: 16px;
    padding: 10px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .page-btn:disabled { opacity: .4; cursor: default; }
  .page-btn:not(:disabled):hover { border-color: var(--accent); }
  .page-info {
    font-size: 15px;
    color: var(--muted);
    min-width: 84px;
    text-align: center;
  }

  /* ===== 弹窗 ===== */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.55);
    animation: fadeIn .2s ease;
  }
  .modal-box {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    animation: popIn .22s ease;
  }
  .modal-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    background: #efe6d4;
  }
  .modal-name {
    margin: 16px 0 2px;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
  }
  .modal-detail {
    margin: 14px 2px 2px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-soft);
    text-align: left;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: #3a3a3a;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .modal-close:hover { background: #000; }
  .modal-close svg { width: 20px; height: 20px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn  { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

  /* ===== 回到顶部 ===== */
  .back-top {
    position: fixed;
    right: 20px;
    bottom: 24px;
    z-index: 40;
    width: 48px;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s,
                background-color .4s ease, color .4s ease, border-color .4s ease;
  }
  .back-top.show { opacity: 1; visibility: visible; transform: none; }
  .back-top:hover { border-color: var(--accent); }
  .back-top svg { width: 24px; height: 24px; }

  /* ===== 页脚 ===== */
  .site-footer {
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 20px 40px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }

  /* ===== 管理员 ===== */
  .admin-btn {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .admin-btn:hover { border-color: var(--accent); }
  .admin-btn svg { width: 22px; height: 22px; }

  .pass-box { max-width: 340px; }
  .pass-title { margin: 4px 0 16px; font-size: 20px; font-weight: 700; }
  .pass-input {
    width: 100%;
    padding: 13px 16px;
    font-size: 22px;
    letter-spacing: 8px;
    text-align: center;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
  }
  .pass-input:focus { border-color: var(--accent); }
  .pass-error { margin: 12px 0 0; color: #c94b3d; font-size: 14px; }
  .btn-primary {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .btn-primary:hover { filter: brightness(1.05); }

  .admin-panel {
    position: fixed;
    inset: 0;
    z-index: 55;
    background: var(--bg);
    overflow-y: auto;
    padding: 20px;
  }
  .admin-inner { max-width: 720px; margin: 0 auto; }
  .admin-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .admin-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .btn-sm {
    padding: 8px 14px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .btn-sm:hover { border-color: var(--accent); }
  .btn-sm.danger { color: #c94b3d; }
  .btn-sm.danger:hover { border-color: #c94b3d; }
  .btn-add {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 16px;
    font-weight: 600;
    border: 1px dashed var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--accent);
    cursor: pointer;
  }
  .btn-add:hover { border-color: var(--accent); }
  .admin-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .admin-thumb {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    flex: none;
    background: #efe6d4;
  }
  .admin-info { flex: 1; min-width: 0; }
  .admin-name { font-size: 16px; font-weight: 600; }
  .admin-tags { font-size: 13px; color: var(--muted); }
  .admin-actions { display: flex; gap: 8px; flex: none; }
  .admin-empty { text-align: center; color: var(--muted); padding: 30px 0; }

  .form-box { max-width: 440px; text-align: left; max-height: 90vh; overflow-y: auto; }
  .form-box h2 { margin: 4px 0 16px; font-size: 20px; font-weight: 700; text-align: center; }
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .form-field input,
  .form-field select,
  .form-field textarea {
    width: 100%;
    padding: 11px 13px;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  .form-field textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus { border-color: var(--accent); }
  .f-preview {
    display: block;
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 10px;
    background: #efe6d4;
  }
  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .form-actions .btn-sm { flex: 1; }

  /* ===== 操作提示 ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    z-index: 70;
    padding: 12px 24px;
    font-size: 15px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    max-width: 80vw;
    text-align: center;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button id="adminBtn" class="admin-btn" aria-label="管理" title="管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </button>
    <h1 class="site-title">饼干<span class="accent">小铺</span></h1>
    <button id="themeToggle" class="theme-btn" aria-label="切换深浅色" title="切换深浅色">
      <!-- 太阳 -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
      <!-- 月亮 -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M21 21l-4.35-4.35"></path>
    </svg>
    <input id="searchInput" class="search-input" type="search" placeholder="输入名称找饼干..." autocomplete="off">
  </div>
</header>

<main class="content">
  <div id="grid" class="grid"></div>
  <nav id="pager" class="pager" hidden>
    <button id="prevPage" class="page-btn" type="button">‹ 上一页</button>
    <span id="pageInfo" class="page-info">第 1 / 1 页</span>
    <button id="nextPage" class="page-btn" type="button">下一页 ›</button>
  </nav>
  <p id="empty" class="empty" hidden>目前我们没有这个产品哦～</p>
</main>

<footer class="site-footer">仅作展示 · 想拿多少、怎么拿，我们在外面慢慢聊～</footer>

<button id="backToTop" class="back-top" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</button>

<div id="toast" class="toast" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button class="modal-close" data-close aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
    <img id="modalImg" class="modal-img" alt="">
    <h2 id="modalName" class="modal-name"></h2>
    <p id="modalDetail" class="modal-detail" hidden></p>
  </div>
</div>

<!-- 管理员登录 -->
<div id="passModal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box pass-box" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
    <h2 class="pass-title">管理员登录</h2>
    <div class="form-field">
      <label>邮箱</label>
      <input id="loginEmail" type="email" placeholder="管理员的邮箱" autocomplete="email">
    </div>
    <div class="form-field">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    </div>
    <p id="passError" class="pass-error" hidden></p>
    <button id="passConfirm" class="btn-primary" type="button">登录</button>
  </div>
</div>

<!-- 管理员后台 -->
<div id="adminPanel" class="admin-panel" hidden>
  <div class="admin-inner">
    <div class="admin-head">
      <h2>管理后台</h2>
      <button id="adminExit" class="btn-sm" type="button">退出登录</button>
    </div>
    <button id="addProduct" class="btn-add" type="button">＋ 新增产品</button>
    <div id="adminList"></div>
  </div>
</div>

<!-- 新增/编辑产品表单 -->
<div id="productForm" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box form-box" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
    <h2 id="formTitle">新增产品</h2>
    <div class="form-field">
      <label>产品名称</label>
      <input id="fName" type="text" placeholder="例如：油酥饼（有糖）">
    </div>
    <div class="form-field">
      <label>口味（决定图片角落的小圆点）</label>
      <select id="fTag">
        <option value="">无口味区分</option>
        <option value="有糖">有糖</option>
        <option value="无糖">无糖</option>
      </select>
    </div>
    <div class="form-field">
      <label>详情介绍</label>
      <textarea id="fDetail" placeholder="写一句介绍，卡片和点开后都会显示"></textarea>
    </div>
    <div class="form-field">
      <label>排序（数字越小越靠前，留空 = 排最后）</label>
      <input id="fSort" type="number" min="0" step="1" placeholder="例如 1、2、3">
    </div>
    <div class="form-field">
      <label>照片（可上传、替换或删除）</label>
      <input id="fImage" type="file" accept="image/*">
      <img id="fPreview" class="f-preview" alt="" hidden>
    </div>
    <div class="form-actions">
      <button id="fClearImage" class="btn-sm" type="button">删除照片</button>
      <button id="fSave" class="btn-sm" type="button">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var PAGE_SIZE = 6;
  var STORAGE_KEY = 'cookies_products_v1';   // 浏览器本地保存的产品数据

  // 读浏览器里保存过的本地备份
  function loadProducts() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { var arr = JSON.parse(raw); if (Array.isArray(arr)) return arr; }
    } catch (e) {}
    return [];
  }
  function saveProducts(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  // ===== Supabase 连接 =====
  var SUPABASE_URL = 'https://hihgflwyzfcieerxkjdz.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpaGdmbHd5emZjaWVlcnhramR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MzAyODksImV4cCI6MjEwMzIwNjI4OX0.8wLEynIcxbV67nUPTY0i3Q1RMr2nx--ZlTua34DSBk4';
  var sb = (typeof supabase !== 'undefined')
    ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // 从 Supabase 读产品；读不到就用本地备份
  async function initProducts() {
    if (sb) {
      try {
        var res = await sb.from('products').select('*')
          .order('sort', { ascending: true, nullsFirst: false })
          .order('id', { ascending: true });
        if (!res.error && Array.isArray(res.data)) {
          PRODUCTS = res.data;
          saveProducts(PRODUCTS);
          return;
        }
      } catch (e) {}
    }
    PRODUCTS = loadProducts();
  }

  var PRODUCTS = [];   // 产品列表（启动时由 initProducts 填上）

  // 没有照片时显示的占位图
  var PLACEHOLDER_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">' +
    '<rect width="480" height="480" fill="#efe6d4"/>' +
    '<g fill="#d8c9ad">' +
    '<circle cx="240" cy="220" r="86"/>' +
    '<circle cx="188" cy="188" r="12"/><circle cx="240" cy="160" r="12"/><circle cx="292" cy="188" r="12"/>' +
    '<circle cx="240" cy="220" r="12"/><circle cx="192" cy="244" r="12"/><circle cx="288" cy="244" r="12"/>' +
    '</g>' +
    '<text x="240" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" fill="#a2947f">照片待添加</text>' +
    '</svg>';
  var PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(PLACEHOLDER_SVG);

  var gridEl = document.getElementById('grid');
  var emptyEl = document.getElementById('empty');
  var pager = document.getElementById('pager');
  var prevBtn = document.getElementById('prevPage');
  var nextBtn = document.getElementById('nextPage');
  var pageInfo = document.getElementById('pageInfo');
  var searchInput = document.getElementById('searchInput');
  var modal = document.getElementById('modal');
  var modalImg = document.getElementById('modalImg');
  var modalName = document.getElementById('modalName');
  var modalDetail = document.getElementById('modalDetail');
  var backToTop = document.getElementById('backToTop');
  var themeToggle = document.getElementById('themeToggle');
  var EMPTY_TEXT = emptyEl.textContent;   // 记住空提示的原文字

  // 底部小提示（操作成功/失败时用）
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.style.background = isError ? '#7a2d24' : 'var(--surface)';
    toastEl.style.color = isError ? '#fff' : 'var(--text)';
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
  }

  var currentPage = 1;
  var mqMobile = window.matchMedia('(max-width: 599px)');
  function isMobile() { return mqMobile.matches; }

  function pic(item) { return item.image || PLACEHOLDER; }

  function buildCard(item) {
    var card = document.createElement('article');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', item.name);

    var wrap = document.createElement('div');
    wrap.className = 'card-img-wrap';

    var img = document.createElement('img');
    img.className = 'card-img';
    img.loading = 'lazy';
    img.alt = item.name;
    img.src = pic(item);
    wrap.appendChild(img);

    if (item.tag) {
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.setAttribute('data-tag', item.tag);
      dot.title = item.tag;
      wrap.appendChild(dot);
    }

    var name = document.createElement('h3');
    name.className = 'card-name';
    name.textContent = item.name;

    card.appendChild(wrap);
    card.appendChild(name);

    if (item.detail) {
      var detail = document.createElement('p');
      detail.className = 'card-detail';
      detail.textContent = item.detail;
      card.appendChild(detail);
    }

    var hint = document.createElement('p');
    hint.className = 'card-hint';
    hint.textContent = '点开查看详情';
    card.appendChild(hint);

    card.addEventListener('click', function () { openModal(item); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(item); }
    });
    return card;
  }

  function getFiltered() {
    var q = searchInput.value.trim().toLowerCase();
    return PRODUCTS.filter(function (p) { return p.name.toLowerCase().indexOf(q) !== -1; });
  }

  function render() {
    var list = getFiltered();
    var totalPages = 1;
    var pageItems = list;

    if (isMobile()) {
      totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      var start = (currentPage - 1) * PAGE_SIZE;
      pageItems = list.slice(start, start + PAGE_SIZE);
    }

    gridEl.innerHTML = '';
    pageItems.forEach(function (item) { gridEl.appendChild(buildCard(item)); });
    emptyEl.textContent = EMPTY_TEXT;
    emptyEl.hidden = list.length > 0;

    if (isMobile() && totalPages > 1) {
      pager.hidden = false;
      pageInfo.textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页';
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    } else {
      pager.hidden = true;
    }
  }

  // 搜索：打字即筛，回到第一页
  searchInput.addEventListener('input', function () {
    currentPage = 1;
    render();
  });

  // 分页（手机）
  prevBtn.addEventListener('click', function () {
    if (currentPage > 1) { currentPage--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  nextBtn.addEventListener('click', function () {
    var total = Math.max(1, Math.ceil(getFiltered().length / PAGE_SIZE));
    if (currentPage < total) { currentPage++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });

  // 从手机横竖屏/宽度变化时，重新排
  mqMobile.addEventListener('change', function () {
    currentPage = 1;
    render();
  });

  // 弹窗
  var lastFocus = null;
  function fillDetail(value) {
    if (value) { modalDetail.textContent = value; modalDetail.hidden = false; }
    else { modalDetail.hidden = true; }
  }
  function openModal(item) {
    lastFocus = document.activeElement;
    modalImg.src = pic(item);
    modalImg.alt = item.name;
    modalName.textContent = item.name;
    fillDetail(item.detail);
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    var closeBtn = modal.querySelector('.modal-close');
    if (closeBtn) closeBtn.focus();
  }
  function closeModal() {
    modal.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  modal.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });

  // 深浅色切换
  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.setAttribute('title', t === 'dark' ? '切换到浅色' : '切换到深色');
  }
  applyTheme(currentTheme());

  themeToggle.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });
  // 没手动选过的时候，跟随系统变化
  mqDark.addEventListener('change', function (e) {
    if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
  });

  // 回到顶部
  var scrolling = false;
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function stopScroll() { scrolling = false; }
  function scrollToTop() {
    scrolling = true;
    var startY = window.scrollY;
    if (startY <= 0) { scrolling = false; return; }
    var duration = 500;
    var startTime = performance.now();
    function step(now) {
      if (!scrolling) return;
      var t = Math.min((now - startTime) / duration, 1);
      window.scrollTo(0, startY * (1 - easeOutCubic(t)));
      if (t < 1) requestAnimationFrame(step);
      else scrolling = false;
    }
    requestAnimationFrame(step);
  }
  backToTop.addEventListener('click', scrollToTop);
  // 用户自己滚动时立即停下
  window.addEventListener('wheel', stopScroll, { passive: true });
  window.addEventListener('touchmove', stopScroll, { passive: true });
  window.addEventListener('keydown', function (e) {
    var keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', ' '];
    if (keys.indexOf(e.key) !== -1) stopScroll();
  });

  function updateBackTop() {
    backToTop.classList.toggle('show', window.scrollY > 300);
  }
  window.addEventListener('scroll', updateBackTop, { passive: true });
  updateBackTop();

  // ===== 管理员 =====
  var adminBtn = document.getElementById('adminBtn');
  var passModal = document.getElementById('passModal');
  var loginEmail = document.getElementById('loginEmail');
  var loginPass = document.getElementById('loginPass');
  var passConfirm = document.getElementById('passConfirm');
  var passError = document.getElementById('passError');
  var adminPanel = document.getElementById('adminPanel');
  var adminList = document.getElementById('adminList');
  var adminExit = document.getElementById('adminExit');
  var addBtn = document.getElementById('addProduct');
  var productForm = document.getElementById('productForm');
  var formTitle = document.getElementById('formTitle');
  var fName = document.getElementById('fName');
  var fTag = document.getElementById('fTag');
  var fDetail = document.getElementById('fDetail');
  var fSort = document.getElementById('fSort');
  var fImage = document.getElementById('fImage');
  var fPreview = document.getElementById('fPreview');
  var fClear = document.getElementById('fClearImage');
  var fSave = document.getElementById('fSave');

  var editingId = null;      // 正在编辑的产品下标（null = 新增）
  var pendingImage = null;   // 表单里的照片：null=不改，''=删除，字符串=新照片
  var loggedIn = false;      // 是否已登录 Supabase

  // 监听登录状态（打开页面 / 登录 / 退出都会触发）
  if (sb) {
    sb.auth.onAuthStateChange(function (event, session) {
      loggedIn = !!session;
    });
  }

  function openPass() {
    loginEmail.value = '';
    loginPass.value = '';
    passError.hidden = true;
    passModal.hidden = false;
    setTimeout(function () { loginEmail.focus(); }, 50);
  }
  function closePass() { passModal.hidden = true; }

  function showError(msg) {
    passError.textContent = msg;
    passError.hidden = false;
  }

  async function tryLogin() {
    if (!sb) { showToast('连不上数据库，无法登录', true); return; }
    var email = loginEmail.value.trim();
    var pass = loginPass.value;
    if (!email || !pass) { showError('请填邮箱和密码'); return; }
    var res = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (res.error) { showError('登录失败：' + (res.error.message || '邮箱或密码不对')); return; }
    closePass();
    openAdmin();
  }

  function openAdmin() {
    adminPanel.hidden = false;
    document.body.style.overflow = 'hidden';
    renderAdminList();
  }
  function closeAdmin() {
    adminPanel.hidden = true;
    document.body.style.overflow = '';
  }

  function renderAdminList() {
    adminList.innerHTML = '';
    if (!PRODUCTS.length) {
      var empty = document.createElement('p');
      empty.className = 'admin-empty';
      empty.textContent = '还没有产品，点上面的「＋ 新增产品」开始。';
      adminList.appendChild(empty);
      return;
    }
    PRODUCTS.forEach(function (item, i) {
      var row = document.createElement('div');
      row.className = 'admin-row';

      var thumb = document.createElement('img');
      thumb.className = 'admin-thumb';
      thumb.src = pic(item);
      thumb.alt = item.name;

      var info = document.createElement('div');
      info.className = 'admin-info';
      var nm = document.createElement('div');
      nm.className = 'admin-name';
      nm.textContent = item.name;
      var tags = document.createElement('div');
      tags.className = 'admin-tags';
      tags.textContent = (item.tag ? item.tag : '无口味区分') + (item.sort ? ' · 排序' + item.sort : '');
      info.appendChild(nm);
      info.appendChild(tags);

      var actions = document.createElement('div');
      actions.className = 'admin-actions';
      var editBtn = document.createElement('button');
      editBtn.className = 'btn-sm';
      editBtn.textContent = '编辑';
      editBtn.addEventListener('click', function () { openForm(i); });
      var delBtn = document.createElement('button');
      delBtn.className = 'btn-sm danger';
      delBtn.textContent = '删除';
      delBtn.addEventListener('click', function () { removeProduct(i); });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      row.appendChild(thumb);
      row.appendChild(info);
      row.appendChild(actions);
      adminList.appendChild(row);
    });
  }

  async function removeProduct(i) {
    var item = PRODUCTS[i];
    if (!item) return;
    if (!confirm('确定删除「' + item.name + '」吗？')) return;
    try {
      if (sb && item.id != null) {
        var res = await sb.from('products').delete().eq('id', item.id);
        if (res.error) throw res.error;
      }
      PRODUCTS.splice(i, 1);
      saveProducts(PRODUCTS);
      renderAdminList();
      render();
      showToast('删除成功！');
    } catch (e) {
      showToast('删除失败：' + (e.message || '请检查网络'), true);
    }
  }

  function updatePreview() {
    if (pendingImage) {                      // 新选的照片
      fPreview.src = pendingImage;
      fPreview.hidden = false;
    } else if (pendingImage === '') {        // 明确删除照片
      fPreview.removeAttribute('src');
      fPreview.hidden = true;
    } else {                                 // 保持原样
      var src = editingId !== null ? (PRODUCTS[editingId].image || '') : '';
      if (src) { fPreview.src = src; fPreview.hidden = false; }
      else { fPreview.removeAttribute('src'); fPreview.hidden = true; }
    }
  }

  function openForm(i) {
    editingId = (i === null || i === undefined) ? null : i;
    pendingImage = null;
    var item = editingId !== null ? PRODUCTS[editingId] : {};
    formTitle.textContent = editingId !== null ? '编辑产品' : '新增产品';
    fName.value = item.name || '';
    fTag.value = item.tag || '';
    fDetail.value = item.detail || '';
    fSort.value = (item.sort != null && item.sort !== 0) ? item.sort : '';
    fImage.value = '';
    updatePreview();
    productForm.hidden = false;
  }
  function closeForm() { productForm.hidden = true; }

  fImage.addEventListener('change', function () {
    var file = fImage.files && fImage.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      pendingImage = reader.result;   // 转成 base64 存起来
      updatePreview();
    };
    reader.readAsDataURL(file);
  });

  fClear.addEventListener('click', function () {
    pendingImage = '';
    fImage.value = '';
    updatePreview();
  });

  fSave.addEventListener('click', async function () {
    var name = fName.value.trim();
    if (!name) { alert('请填产品名称'); return; }
    var sortVal = fSort.value.trim();
    var item = {
      name: name,
      tag: fTag.value,
      detail: fDetail.value.trim(),
      sort: sortVal === '' ? null : (parseInt(sortVal, 10) || 0),
      image: pendingImage !== null ? pendingImage
           : (editingId !== null ? (PRODUCTS[editingId].image || '') : '')
    };
    try {
      if (editingId !== null) {
        var old = PRODUCTS[editingId];
        if (sb && old.id != null) {
          var up = await sb.from('products')
            .update({ name: item.name, image: item.image, tag: item.tag, detail: item.detail, sort: item.sort })
            .eq('id', old.id);
          if (up.error) throw up.error;
        }
        PRODUCTS[editingId] = item;
        showToast('修改成功！');
      } else {
        if (sb) {
          var ins = await sb.from('products').insert(item);
          if (ins.error) throw ins.error;
          PRODUCTS.push(ins.data && ins.data[0] ? ins.data[0] : item);
        } else {
          PRODUCTS.push(item);
        }
        showToast('添加成功！');
      }
      saveProducts(PRODUCTS);
      closeForm();
      renderAdminList();
      render();
    } catch (e) {
      showToast('保存失败：' + (e.message || '请检查网络'), true);
    }
  });

  adminBtn.addEventListener('click', function () {
    if (loggedIn) { openAdmin(); }
    else { openPass(); }
  });
  passConfirm.addEventListener('click', tryLogin);
  loginPass.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryLogin();
  });
  adminExit.addEventListener('click', function () {
    if (sb) sb.auth.signOut();
    closeAdmin();
  });
  addBtn.addEventListener('click', function () { openForm(null); });

  passModal.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) closePass();
  });
  productForm.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) closeForm();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!productForm.hidden) closeForm();
      else if (!passModal.hidden) closePass();
    }
  });

  // ===== 启动：先读 Supabase，读不到用本地备份 =====
  if (sb) {
    emptyEl.textContent = '正在加载饼干...';
    emptyEl.hidden = false;
  }
  initProducts().then(function () {
    render();
  });
})();
</script>
</body>
</html>
